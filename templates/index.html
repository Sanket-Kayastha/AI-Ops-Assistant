<!DOCTYPE html>
<html>
<head>
    <title>AI Operations Assistant</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }
        textarea {
            width: 100%;
            height: 80px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: white;
            padding: 15px;
            overflow-x: auto;
        }
        h2 {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h1>🤖 AI Operations Assistant</h1>

<form method="POST">
    <textarea name="task" placeholder="Enter your task..." required></textarea>
    <br><br>
    <button type="submit">Run Task</button>
</form>

{% if plan %}
    <h2>Planner Output</h2>
    <pre>{{ plan | tojson(indent=2) }}</pre>
{% endif %}

{% if result %}
    <h2>Executor Output</h2>
    <pre>{{ result | tojson(indent=2) }}</pre>
{% endif %}

{% if final_output %}
    <h2>Final Verified Output</h2>
    <pre>{{ final_output | tojson(indent=2) }}</pre>
{% endif %}

</body>
</html>
